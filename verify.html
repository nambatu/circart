<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artline - Image Verification Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; background: #eee; }
        .card h3 { margin: 0 0 5px 0; font-size: 1.1em; color: #222; }
        .card p { margin: 0 0 10px 0; font-size: 0.9em; color: #555; }
        .card input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .card button { padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .card button:hover { background: #0056b3; }
        .card.success { border: 2px solid #28a745; }
        .card.error { border: 2px solid #dc3545; }
        .missing { border: 2px solid #ffc107; }
    </style>
</head>
<body>

    <h1>Image Verification Dashboard</h1>
    <p style="text-align: center;">Scroll through your dataset. If an image is wrong, paste a Google Image URL below it and click Update.</p>
    
    <div class="grid" id="grid"></div>

    <script>
        async function load() {
            const res = await fetch('artline.json');
            const data = await res.json();
            const grid = document.getElementById('grid');
            
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                if (!item.image_local && !item.image) div.classList.add('missing');
                
                const imgSrc = item.image_local || item.image || '';
                
                div.innerHTML = `
                    <img id="img-${item.id}" src="${imgSrc.replace(/\\\\/g, '/')}" loading="lazy" alt="Artwork">
                    <h3>${item.title}</h3>
                    <p>${item.artist} (${item.year})<br><small>Source: ${item.source}</small></p>
                    <input type="text" id="input-${item.id}" placeholder="Paste new image URL...">
                    <button onclick="updateImage('${item.id}')">Update Image</button>
                `;
                grid.appendChild(div);
            });
        }
        
        async function updateImage(id) {
            const input = document.getElementById(`input-${id}`);
            const btn = input.nextElementSibling;
            const url = input.value.trim();
            const card = input.closest('.card');
            
            if (!url) return;
            
            btn.textContent = 'Updating...';
            btn.disabled = true;
            card.classList.remove('success', 'error');
            
            try {
                const res = await fetch('/update_image', {
                    method: 'POST',
                    body: JSON.stringify({ id, url }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById(`img-${id}`).src = data.path;
                    card.classList.add('success');
                    input.value = '';
                    btn.textContent = 'Updated!';
                } else {
                    throw new Error('Server returned false');
                }
            } catch (err) {
                console.error(err);
                card.classList.add('error');
                btn.textContent = 'Error!';
            }
            
            setTimeout(() => {
                btn.textContent = 'Update Image';
                btn.disabled = false;
                card.classList.remove('success', 'error');
            }, 3000);
        }
        
        load();
    </script>
</body>
</html>
